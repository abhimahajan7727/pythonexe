name: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter pyperclip pandas
        # Tkinter might need to be installed on some systems, so you can explicitly install it:
        # Tkinter is usually bundled with Python, but in case it's missing on Windows, try installing the 'tk' package
        # Use `apt-get` to install tkinter in case it is not available.
        # On Windows, it should be available, but we can install it via Chocolatey if necessary
        choco install python-tk

    - name: Build EXE
      run: pyinstaller --onefile --windowed --distpath=dist --workpath=build Form.py

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-exe
        path: dist/Form.exe
