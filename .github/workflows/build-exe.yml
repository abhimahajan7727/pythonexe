name: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build EXE
      run: pyinstaller --onefile --windowed --distpath=dist --workpath=build --hidden-import=customtkinter Form.py


    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-exe
        path: dist/Form.exe  
