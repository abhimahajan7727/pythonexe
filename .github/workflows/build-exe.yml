name: Build EXE

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter

    - name: Generate .spec file
      run: pyinstaller --onefile --windowed --distpath=dist --workpath=build Form.py

    - name: Edit .spec file for hidden imports (PowerShell)
      run: |
        powershell -Command "(Get-Content Form.spec) -replace 'hiddenimports=\[\]', 'hiddenimports=["customtkinter\"]' | Set-Content Form.spec"

    - name: Build EXE using .spec file
      run: pyinstaller Form.spec

    - name: Upload EXE Artifact
      uses: actions/upload-artifact@v4
      with:
        name: built-exe
        path: dist/Form.exe
