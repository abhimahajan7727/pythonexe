name: Build Executable

on:
  push:
    branches:
      - main  # Trigger the action when code is pushed to the `main` branch
  pull_request:
    branches:
      - main  # Also run on PR to main branch

jobs:
  build:
    runs-on: windows-latest  # Use a Windows runner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'  # Specify the Python version you need

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build executable using PyInstaller
        run: |
          pyinstaller --onefile --windowed --distpath=dist --workpath=build Form.py

      - name: Upload executable
        uses: actions/upload-artifact@v3  # Updated to version 3
        with:
          name: Form-executable
          path: dist/Form.exe
